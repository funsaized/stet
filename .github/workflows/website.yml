name: Website quality

on:
  push:
    branches: [master]
    paths: ["website/**", "src/**", "agent/**", "style.css", "package*.json", "scripts/agent/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "src/**", "agent/**", "style.css", "package*.json", "scripts/agent/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run check
        working-directory: .
      - run: npm test -- tests/agent/showcase.test.ts
        working-directory: .
      - run: npm run build && npm run test:templates
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: static-showcase
          path: website/dist/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-results
          path: website/test-results/
          retention-days: 7
