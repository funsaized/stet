name: Library and agent contract
on:
  push:
    branches: [master]
    paths: ['src/**', 'agent/**', 'tests/**', 'scripts/agent/**', 'style.css', 'package*.json', '*config*', 'scripts-size.mjs', '.github/workflows/library.yml']
  pull_request:
    paths: ['src/**', 'agent/**', 'tests/**', 'scripts/agent/**', 'style.css', 'package*.json', '*config*', 'scripts-size.mjs', '.github/workflows/library.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Check committed generated artifacts before any build can regenerate them.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:templates
      - run: npm run test:package
      - run: npm run size
