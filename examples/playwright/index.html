<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/examples/playwright/style.css" />
    <script type="module" src="/examples/playwright/source.js"></script>
    <title>Stet Playwright capture</title>
  </head>
  <body>
    <main id="capture" aria-labelledby="title">
      <p class="eyebrow">Review context: checkout handoff</p>
      <h1 id="title">Confirm the delivery details</h1>
      <p>The source annotation marks the total. The temporary test annotation marks the action under review.</p>
      <dl><dt>Total</dt><dd id="total">$42.00</dd></dl>
      <button id="submit" type="button">Place order</button>
    </main>
  </body>
</html>
