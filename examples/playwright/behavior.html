<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <link rel="stylesheet" href="/examples/playwright/behavior.css" />
    <script type="module" src="/examples/playwright/behavior.js"></script>
    <title>Stet behavior handoff</title>
  </head>
  <body>
    <main>
      <h1>Receipt settings</h1>
      <form id="form">
        <label for="email">Receipt email</label>
        <input id="email" name="email" type="email" aria-describedby="native-help" />
        <p id="native-help">Email used for the receipt</p>
        <button id="submit" type="submit">Save receipt</button>
      </form>
      <output id="status" aria-live="polite">Not submitted</output>
    </main>
  </body>
</html>
